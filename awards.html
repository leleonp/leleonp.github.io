<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Luis E. León Ph.D. | Awards</title>
  <meta name="description" content="Awards, honors and recognitions of Luis E. León">
  <link rel="icon" href="img/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>
  <script>
    fetch('navbar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('navbar').innerHTML = data;
        const navLinks = document.querySelectorAll('.nav-link');
        const currentPath = window.location.pathname.split('/').pop() || 'index.html';
        navLinks.forEach(link => {
          const href = link.getAttribute('href');
          if (!href || href.startsWith('http') || href.startsWith('mailto:')) return;
          const linkPath = href.replace('./', '');
          if (linkPath === currentPath || (currentPath === '' && linkPath === 'index.html')) {
            link.classList.add('active');
          } else {
            link.classList.remove('active');
          }
        });
      });
  </script>

  <div class="container mb-5">
    <!-- Profile Header -->
    <header class="text-center mb-5">
      <div class="d-flex flex-column align-items-center">
        <figure class="mb-3">
          <img src="img/profile_picture.jpeg" alt="Profile picture" class="rounded-circle" width="100" height="100">
        </figure>
        <h1>Luis E. León Ph.D.</h1>
        <h2>Computational Biologist · Bioinformatician · Data Scientist</h2>
      </div>
    </header>

    <h1 class="mb-4"><i class="bi bi-award me-2"></i>Honors & Awards</h1>

    <section id="awards-container" class="row g-3">
      <!-- Awards will be injected here from data/csv/awards.csv -->
    </section>
  </div>

  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">&copy; [Year] Luis E. León | <a href="https://github.com/leleonp" class="text-white">GitHub</a></p>
  </footer>

  <script src="scripts/utils.js"></script>
  
  <script src="scripts/csv_loader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
