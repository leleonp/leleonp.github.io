<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Luis E. León Ph.D. | Blog</title>
    <meta name="description" content="Blog posts by Luis E. León.">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<div id="navbar"></div>
<script>
  fetch('navbar.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('navbar').innerHTML = data;
      const navLinks = document.querySelectorAll('.nav-link');
      const currentPath = window.location.pathname.split('/').pop() || 'index.html';
      navLinks.forEach(link => {
        const href = link.getAttribute('href');
        if (!href || href.startsWith('http') || href.startsWith('mailto:')) return;
        const linkPath = href.replace('./', '');
        if (linkPath === currentPath || (currentPath === '' && linkPath === 'index.html')) {
          link.classList.add('active');
        } else {
          link.classList.remove('active');
        }
      });
    });
</script>

<div class="container mb-5">
    <!-- Profile Header -->
    <header class="text-center mb-5">
        <div class="d-flex flex-column align-items-center">
            <figure class="mb-3">
                <img src="img/profile_picture.jpeg" alt="Profile picture" class="rounded-circle" width="100" height="100">
            </figure>
            <h1>Luis E. León Ph.D.</h1>
            <h2>Computational Biologist · Bioinformatician · Data Scientist</h2>
        </div>
    </header>

    <!-- Search Bar -->
    <div class="row mb-4">
        <div class="col-md-8 mx-auto">
            <div class="input-group">
                <input type="text" class="form-control" id="searchInput" placeholder="Search blog posts...">
                <button class="btn btn-outline-primary" type="button" id="searchBtn">
                    <i class="bi bi-search"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Filter Tags -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="d-flex flex-wrap gap-2" id="tagFilters">
                <button class="btn btn-sm btn-outline-secondary active" data-tag="all">All</button>
            </div>
        </div>
    </div>

    <h1 class="mb-4">Blog Posts</h1>

    <!-- Blog Posts Container -->
    <div id="blogContainer">
        <!-- Posts will be loaded from CSV -->
    </div>

    <!-- No Results Message -->
    <div id="noResults" class="text-center py-5" style="display: none;">
        <h4>No posts found</h4>
        <p>Try adjusting your search or filter criteria.</p>
    </div>
</div>

<footer class="bg-dark text-white text-center py-4 mt-5">
    <p class="mb-0 small">&copy; 2026 Luis E. León, Ph.D. | <a href="https://github.com/leleonp" class="text-white text-decoration-underline">GitHub</a></p>
</footer>

<script src="scripts/utils.js"></script>

<script src="scripts/csv_loader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="scripts/blog.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
